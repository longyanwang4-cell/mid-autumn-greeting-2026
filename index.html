<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#070d1f">
<title>月满中秋 · 花好月圆</title>
<meta property="og:title" content="月满中秋 · 花好月圆">
<meta property="og:description" content="海上生明月，天涯共此时。愿诸君如皓月，常圆满、常明亮。">
<style>
  :root{
    --ink:#f2ecdd;
    --muted:#c3b491;
    --gold:#e6ca8b;
    --gold-soft:#c8ab74;
    --seal:#b53526;
    --font-serif:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC","SimSun",Georgia,serif;
    --font-brush:"Kaiti SC","STKaiti","KaiTi","楷体","Noto Serif SC","Songti SC",serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background:#04060d;color:var(--ink);
    font-family:var(--font-serif);
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
    user-select:none;-webkit-user-select:none;
  }
  #scene{position:fixed;inset:0;width:100vw;height:100vh;display:block;z-index:1;}
  .scrim{
    position:fixed;inset:0;z-index:2;pointer-events:none;
    background:
      radial-gradient(72% 48% at 50% 44%, rgba(4,7,16,0.30) 0%, rgba(4,7,16,0.06) 58%, transparent 80%),
      linear-gradient(180deg, rgba(4,7,16,0.30) 0%, transparent 12%, transparent 84%, rgba(4,7,16,0.42) 100%);
  }
  .ui{position:fixed;inset:0;z-index:3;pointer-events:none;}
  .ui .tappable{pointer-events:auto;}

  .kicker{
    position:absolute;top:5%;left:0;right:0;text-align:center;
    font-size:clamp(11px,1.4vw,14px);letter-spacing:.62em;text-indent:.62em;
    color:var(--gold);
  }

  .poem{
    position:absolute;top:24%;left:0;right:0;text-align:center;padding:0 6%;
  }
  .verse{
    font-family:var(--font-brush);
    color:#f4eede;
    font-size:clamp(26px,5.2vw,44px);
    line-height:1.62;
    letter-spacing:.14em;text-indent:.14em;
    text-shadow:0 2px 26px rgba(4,7,16,0.85),0 0 44px rgba(6,8,18,0.6);
  }
  .attrib{
    margin-top:18px;
    font-size:clamp(10px,1.2vw,12.5px);letter-spacing:.36em;text-indent:.36em;
    color:var(--muted);
  }

  .titleblock{
    position:absolute;top:21%;left:0;right:0;text-align:center;padding:0 6%;
  }
  .headline{
    position:relative;display:inline-block;
    font-family:var(--font-brush);font-weight:700;
    font-size:clamp(44px,9vw,96px);
    letter-spacing:.18em;text-indent:.18em;line-height:1.18;
    background:linear-gradient(180deg,#fdf6e2 0%,#f0d293 58%,#dfba72 100%);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;
    filter:drop-shadow(0 3px 26px rgba(230,190,110,0.10));
  }
  .headline::after{
    content:"";position:absolute;top:-8%;left:-32%;
    width:36%;height:118%;
    background:linear-gradient(105deg,transparent,rgba(255,255,255,0.5),transparent);
    mix-blend-mode:screen;transform:skewX(-12deg);
    opacity:0;pointer-events:none;
  }
  .rule{
    width:44px;height:1px;margin:22px auto 20px;
    background:linear-gradient(90deg,transparent,var(--gold-soft),transparent);
  }
  .wish{
    font-size:clamp(14px,2.1vw,19px);
    letter-spacing:.30em;text-indent:.30em;line-height:2.05;
    color:#dcd0ae;
    text-shadow:0 2px 18px rgba(4,7,16,0.8);
  }
  .wish-sub{
    margin-top:10px;
    font-size:clamp(11px,1.4vw,13.5px);
    letter-spacing:.30em;text-indent:.30em;
    color:rgba(200,182,140,0.85);
  }

  .sign{
    position:absolute;right:6.5%;bottom:calc(7% + env(safe-area-inset-bottom));
    display:flex;align-items:center;gap:14px;
  }
  .sign .closing{
    font-family:var(--font-brush);
    font-size:clamp(15px,1.9vw,19px);
    letter-spacing:.30em;text-indent:.30em;
    color:var(--gold);
    text-shadow:0 2px 14px rgba(4,7,16,0.8);
  }
  .seal{
    width:clamp(40px,4.6vw,50px);height:clamp(40px,4.6vw,50px);border-radius:3px;
    background:var(--seal);
    display:flex;align-items:center;justify-content:center;
    transform:rotate(-3deg);
    box-shadow:inset 0 0 0 2px var(--seal),inset 0 0 0 3px rgba(244,234,208,0.55),0 3px 12px rgba(0,0,0,0.4);
  }
  .seal span{
    color:#f4ead0;font-family:var(--font-serif);font-weight:500;
    font-size:clamp(20px,2.3vw,25px);line-height:1;
  }

  .hint{
    position:absolute;left:0;right:0;bottom:calc(4.2% + env(safe-area-inset-bottom));text-align:center;
    font-size:clamp(10px,1.2vw,12px);letter-spacing:.34em;text-indent:.34em;
    color:rgba(197,180,145,0.78);
    transition:opacity 1.2s ease;
  }
  .controls{
    position:absolute;right:3.2%;top:4.6%;
    display:flex;flex-direction:column;gap:10px;
  }
  .controls button{
    pointer-events:auto;cursor:pointer;
    font-family:var(--font-serif);
    font-size:clamp(11px,1.2vw,13px);letter-spacing:.18em;text-indent:.18em;
    color:#e8d9ae;
    background:rgba(14,22,42,0.42);
    border:1px solid rgba(214,182,120,0.42);
    border-radius:999px;
    padding:9px 18px 9px 20px;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    transition:opacity .6s ease,border-color .3s ease;
    opacity:.55;
  }
  .controls button:hover{border-color:rgba(240,210,147,0.9);opacity:.95;}
  @media (max-width: 640px){
    .controls{gap:8px;top:calc(4.6% + env(safe-area-inset-top));}
    .controls button{padding:10px 12px;letter-spacing:0;text-indent:0;line-height:1;min-width:42px;min-height:42px;}
    .controls button .lbl{display:none;}
    .go .headline::after{display:none;}   /* 扫光在手机上像色块，小屏去掉 */
  }
  body.clean .controls,body.clean .hint{display:none;}

  /* ================= 开场时间轴 ================= */
  .go .kicker{opacity:0;animation:rise 1.1s cubic-bezier(.2,.7,.2,1) .5s forwards;}
  .go .poem{opacity:0;animation:rise 1.2s ease 2.2s forwards,poemOut 1.1s ease 6.6s forwards;}
  .go .poem .ch{
    display:inline-block;opacity:0;
    animation:chIn .8s cubic-bezier(.2,.7,.2,1) both;
    animation-delay:calc(var(--l) * .75s + var(--i) * .085s + 2.4s);
  }
  .go .poem .attrib{opacity:0;animation:rise 1.2s ease 4.6s forwards;}
  .go .titleblock{opacity:0;animation:rise 1.3s cubic-bezier(.2,.7,.2,1) 7.1s forwards,titleOut 1.6s ease 13s forwards;}
  .headline .ch{
    display:inline-block;
    background:linear-gradient(180deg,#fdf6e2 0%,#f0d293 58%,#dfba72 100%);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;
  }
  .go .titleblock .ch{
    opacity:0;
    animation:headIn .85s cubic-bezier(.2,.75,.25,1) both;
    animation-delay:calc(7.15s + var(--i) * .09s);
  }
  .go .titleblock::after{content:"";display:none;}
  .go .headline::after{animation:sweep 2.2s ease-in-out 8.7s 1 forwards;}
  .go .wish{opacity:0;animation:rise 1.2s ease 9.0s forwards;}
  .go .wish-sub{opacity:0;animation:rise 1.2s ease 9.6s forwards;}
  .go .sign{opacity:0;animation:rise 1.1s ease 10.1s forwards;}
  .go .seal{opacity:0;animation:stamp .55s cubic-bezier(.2,.8,.2,1) 10.7s forwards;}
  .go .hint{opacity:0;animation:fadeSoft 1.4s ease 11.4s forwards;}
  .go .controls{opacity:0;animation:fadeSoft 1.2s ease 3s forwards;}

  @keyframes rise{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
  @keyframes fadeSoft{to{opacity:1;}}
  @keyframes poemOut{
    0%{opacity:1;transform:translateY(0);}
    100%{opacity:0;transform:translateY(-26px);filter:blur(3px);}
  }
  @keyframes titleOut{
    0%{opacity:1;transform:translateY(0);}
    100%{opacity:0;transform:translateY(-30px);filter:blur(5px);}
  }
  @keyframes chIn{
    0%{opacity:0;transform:translateY(14px);}
    100%{opacity:1;transform:translateY(0);}
  }
  @keyframes headIn{
    0%{opacity:0;transform:translateY(20px) scale(1.06);filter:blur(6px);}
    100%{opacity:1;transform:translateY(0) scale(1);filter:blur(0);}
  }
  @keyframes sweep{
    0%{left:-40%;opacity:0;}
    22%{opacity:.85;}
    100%{left:132%;opacity:0;}
  }
  @keyframes stamp{
    0%{opacity:0;transform:rotate(-3deg) scale(1.8);}
    60%{opacity:1;transform:rotate(-3deg) scale(.94);}
    100%{opacity:1;transform:rotate(-3deg) scale(1);}
  }

  @media (prefers-reduced-motion: reduce){
    .kicker,.poem,.titleblock,.wish,.wish-sub,.sign,.hint,.controls,.seal,.poem .ch,.titleblock .ch{
      opacity:1!important;animation:none!important;transform:none!important;filter:none!important;
    }
    .headline::after{display:none;}
  }
</style>
</head>
<body>
  <canvas id="scene"></canvas>
  <div class="scrim"></div>

  <div class="ui">
    <p class="kicker" id="kicker">中秋 · 敬贺</p>

    <div class="poem" id="poem">
      <p class="verse"><span class="ln" data-reveal data-line="0">海上生明月</span><br><span class="ln" data-reveal data-line="1">天涯共此时</span></p>
      <p class="attrib">唐 · 张九龄《望月怀远》</p>
    </div>

    <div class="titleblock" id="titleblock">
      <h1 class="headline"><span data-split>中秋快乐</span></h1>
      <div class="rule"></div>
      <p class="wish">愿诸君如皓月<br>常圆满 · 常明亮</p>
      <p class="wish-sub">实验顺利 · 数据漂亮 · 论文高中 · 阖家幸福</p>
    </div>

    <div class="sign" id="sign">
      <p class="closing" id="closing">敬颂秋祺</p>
      <div class="seal" aria-label="印章：圆"><span>圆</span></div>
    </div>

    <p class="hint tappable" id="hint">点击夜空 · 燃放烟花</p>

    <div class="controls" id="controls">
      <button class="tappable" id="btnLantern" title="放三盏孔明灯">🏮<span class="lbl"> 放一盏灯</span></button>
      <button class="tappable" id="btnReplay" title="重播开场">↺<span class="lbl"> 重播</span></button>
      <button class="tappable" id="btnClean" title="隐藏/显示按钮（快捷键 H）">👁<span class="lbl"> 纯净模式</span></button>
      <button class="tappable" id="btnSound" title="声音开关（快捷键 M）"><span id="sfxIcon">🔊</span><span class="lbl"> 声音</span></button>
    </div>
  </div>

<script>
(function () {
  'use strict';

  /* ==========================================================
   *  自定义区：改成你们课题组的信息即可（留空则显示默认文案）
   *  也可以不改代码，用网址参数覆盖：
   *  index.html?group=XX课题组&from=全体师生&wish=中秋快乐,论文高中
   * ========================================================== */
  var CONFIG = {
    group: '',   // 课题组名称，如 '智能计算课题组'
    from:  '',   // 落款，如 'XX课题组全体师生'
    wishes: [    // 文字烟花轮播的祝福语（2~6字效果最佳）
      '中秋快乐', '花好月圆', '阖家团圆',
      '科研顺利', '论文高中', '数据漂亮',
      '实验顺遂', '平安喜乐'
    ]
  };

  /* ---------- URL 参数覆盖 ---------- */
  try {
    var qs = new URLSearchParams(location.search);
    if (qs.get('group')) CONFIG.group = qs.get('group');
    if (qs.get('from'))  CONFIG.from  = qs.get('from');
    if (qs.get('wish'))  CONFIG.wishes = qs.get('wish').split(/[,，、]/).filter(Boolean);
  } catch (e) {}

  /* ---------- DOM 文案 ---------- */
  document.getElementById('kicker').textContent = CONFIG.group ? (CONFIG.group + ' · 中秋敬贺') : '中秋 · 敬贺';
  if (CONFIG.from) document.getElementById('closing').textContent = CONFIG.from;
  if (!CONFIG.wishes.length) CONFIG.wishes = ['中秋快乐'];

  /* ---------- 逐字拆分（诗词 & 标题） ---------- */
  document.querySelectorAll('[data-reveal]').forEach(function (el) {
    var line = +el.getAttribute('data-line');
    var txt = el.textContent; el.textContent = '';
    for (var i = 0; i < txt.length; i++) {
      var sp = document.createElement('span');
      sp.className = 'ch'; sp.textContent = txt[i];
      sp.style.setProperty('--i', i); sp.style.setProperty('--l', line);
      el.appendChild(sp);
    }
  });
  document.querySelectorAll('[data-split]').forEach(function (el) {
    var txt = el.textContent; el.textContent = '';
    for (var i = 0; i < txt.length; i++) {
      var sp = document.createElement('span');
      sp.className = 'ch'; sp.textContent = txt[i];
      sp.style.setProperty('--i', i);
      el.appendChild(sp);
    }
  });

  /* ---------- 画布 ---------- */
  var cv = document.getElementById('scene');
  var ctx = cv.getContext('2d');
  var W = 0, H = 0, DPR = 1, waterY = 0;
  var moon = { x: 0, y: 0, r: 0 };
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var rnd = function (a, b) { return a + Math.random() * (b - a); };
  var pick = function (arr) { return arr[(Math.random() * arr.length) | 0]; };

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 1.75);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    waterY = H * 0.78;
    var portrait = H > W * 1.2;
    moon.x = W * (portrait ? 0.74 : 0.72);
    moon.y = H * (portrait ? 0.13 : 0.19);
    moon.r = Math.min(W, H) * 0.105;
    seed();
    texts.forEach(function (t) { t.dead = true; });   // 尺寸变化后放弃进行中的文字烟花
  }

  /* ---------- 视差 ---------- */
  var par = { x: 0, y: 0, tx: 0, ty: 0 }, pointerActive = false, lastMove = 0;
  window.addEventListener('pointermove', function (e) {
    par.tx = (e.clientX / W - 0.5) * 2;
    par.ty = (e.clientY / H - 0.5) * 2;
    pointerActive = true; lastMove = performance.now();
  });
  function poffset(d) { ctx.save(); ctx.translate(par.x * d * 30, par.y * d * 18); }
  function pend() { ctx.restore(); }

  /* ---------- 场景元素 ---------- */
  var stars = [], nebula = [], fireflies = [], petals = [], lanterns = [], shoots = [];
  var rockets = [], sparks = [], texts = [];

  function seed() {
    stars.length = 0; nebula.length = 0; fireflies.length = 0; petals.length = 0;
    var area = (W * H) / (1440 * 800);
    var counts = [Math.round(80 * area), Math.round(52 * area), Math.round(24 * area)];
    var depth = [0.10, 0.22, 0.42], base = [0.35, 0.55, 0.8];
    for (var d = 0; d < 3; d++) for (var i = 0; i < counts[d]; i++) {
      stars.push({
        x: Math.random() * W, y: Math.random() * waterY * 0.98,
        r: d === 2 ? rnd(1.1, 2.0) : (d === 1 ? rnd(0.7, 1.3) : rnd(0.4, 0.9)),
        depth: depth[d], tw: rnd(0, Math.PI * 2), sp: rnd(0.6, 1.6), base: base[d]
      });
    }
    for (var n = 0; n < 5; n++) {
      nebula.push({
        x: rnd(0.1, 0.9) * W, y: rnd(0.05, 0.5) * H, rr: rnd(0.26, 0.48) * W,
        hue: n % 2 ? 'rgba(150,170,220,' : 'rgba(210,170,120,',
        a: rnd(0.05, 0.09), depth: 0.06, sp: rnd(0.15, 0.4)
      });
    }
    for (var f = 0; f < Math.round(24 * area); f++) fireflies.push(newFirefly(true));
    for (var p = 0; p < Math.round(22 * area); p++) petals.push(newPetal(true));
  }
  function newFirefly(spread) {
    return {
      x: Math.random() * W, y: spread ? rnd(0.55, 0.98) * H : rnd(0.6, 0.85) * H,
      r: rnd(0.8, 1.7), depth: rnd(0.55, 0.85),
      gx: rnd(0, Math.PI * 2), gy: rnd(0, Math.PI * 2), amp: rnd(6, 20),
      sp: rnd(0.2, 0.55), fl: rnd(0, Math.PI * 2), flsp: rnd(0.8, 1.8)
    };
  }
  function newPetal(spread) {
    return {
      x: Math.random() * W, y: spread ? rnd(-0.1, 1.0) * H : rnd(-0.12, 0) * H,
      r: rnd(1.6, 3.2), depth: rnd(0.6, 1.0),
      vy: rnd(0.10, 0.30), sway: rnd(0.4, 1.1), sw: rnd(0, Math.PI * 2),
      rot: rnd(0, Math.PI * 2), vr: rnd(-0.5, 0.5), a: rnd(0.35, 0.7)
    };
  }

  /* ---------- 普通烟花 ---------- */
  var PALETTES = [
    ['255,214,122', '255,236,190', '255,190,110'],   // 金
    ['255,170,140', '255,214,150', '255,120,120'],   // 暖红
    ['170,225,255', '220,240,255', '200,180,255'],   // 冰蓝
    ['190,235,200', '255,236,190', '160,220,180']    // 玉青
  ];
  var paletteW = [0.45, 0.2, 0.15, 0.2];
  function pickPalette() {
    var r = Math.random(), acc = 0;
    for (var i = 0; i < paletteW.length; i++) { acc += paletteW[i]; if (r < acc) return PALETTES[i]; }
    return PALETTES[0];
  }

  function spawnRocket(tx, ty, scale, palette) {
    playSFX('launch', 0.4);
    rockets.push({
      x: tx + rnd(-60, 60), y: waterY + 10,
      sx: tx + rnd(-60, 60), sy: waterY + 10,
      tx: tx, ty: ty, t: 0, dur: rnd(0.85, 1.1),
      scale: scale || 1, palette: palette || pickPalette(), trail: []
    });
  }
  function explode(x, y, scale, palette) {
    playSFX('burst', 0.55);
    var count = Math.round(rnd(56, 88) * scale);
    for (var i = 0; i < count; i++) {
      var ang = (Math.PI * 2 * i) / count + rnd(-0.1, 0.1);
      var sp = rnd(1.2, 5.6) * scale * (H / 800);
      var col = pick(palette);
      sparks.push({
        x: x, y: y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
        life: 0, ttl: rnd(1.2, 2.0), col: col, seed: rnd(0, 6.28),
        trail: [], spark: Math.random() < 0.25
      });
    }
    // 中心闪光
    sparks.push({ x: x, y: y, vx: 0, vy: 0, life: 0, ttl: 0.35, col: '255,246,220', flash: true, trail: [] });
  }

  /* ---------- 文字烟花 ---------- */
  var measureCv = document.createElement('canvas');
  measureCv.width = 640; measureCv.height = 200;
  var mctx = measureCv.getContext('2d', { willReadFrequently: true });

  function buildTargets(text) {
    mctx.clearRect(0, 0, 640, 200);
    var size = 120;
    mctx.font = '900 ' + size + 'px "KaiTi","STKaiti","KaiTi_GB2312","楷体","Noto Serif SC","SimSun",serif';
    var w = mctx.measureText(text).width;
    if (w > 560) { size = Math.floor(size * 560 / w); mctx.font = '900 ' + size + 'px "KaiTi","STKaiti","KaiTi_GB2312","楷体","Noto Serif SC","SimSun",serif'; }
    mctx.fillStyle = '#fff';
    mctx.textAlign = 'center'; mctx.textBaseline = 'middle';
    mctx.fillText(text, 320, 100);
    var step = 4, pts = [];
    do {
      pts.length = 0;
      var img = mctx.getImageData(0, 0, 640, 200).data;
      for (var y = 0; y < 200; y += step) for (var x = 0; x < 640; x += step) {
        if (img[(y * 640 + x) * 4 + 3] > 128) pts.push({ x: x - 320, y: y - 100 });
      }
      step++;
    } while (pts.length > 520);
    // 洗牌让粒子汇聚顺序更自然
    for (var i = pts.length - 1; i > 0; i--) {
      var j = (Math.random() * (i + 1)) | 0, t = pts[i]; pts[i] = pts[j]; pts[j] = t;
    }
    return pts;
  }

  function spawnTextFirework(text) {
    var apexX = W * rnd(0.38, 0.62), apexY = H * rnd(0.32, 0.42);
    var scale = Math.min((W * 0.82) / 640, (H * 0.17) / 120, 1.3);
    var pts = buildTargets(text);
    var palette = pickPalette();
    var parts = [];
    for (var i = 0; i < pts.length; i++) {
      var ang = rnd(0, Math.PI * 2), sp = rnd(20, 150);
      parts.push({
        x: apexX + Math.cos(ang) * rnd(4, 30), y: apexY + Math.sin(ang) * rnd(4, 30),
        vx: Math.cos(ang) * sp * 0.02, vy: Math.sin(ang) * sp * 0.02,
        tx: apexX + pts[i].x * scale, ty: apexY + pts[i].y * scale,

  /* ---------- 孔明灯 ---------- */

  /* ================= 背景音乐（可选） =================

  function unlockAudio() {

  /* 真实录音音效（Mixkit 免费素材，随页面分发）；文件缺失时自动静默 */

  function playSFX(name, vol) {

  /* ================= 场景绘制 ================= */
  var tGlobal = 0;

  function drawSky() {
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#0a1730'); g.addColorStop(0.4, '#0a1224');
    g.addColorStop(0.72, '#0a1426'); g.addColorStop(1, '#05070f');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    var rg = ctx.createRadialGradient(moon.x, moon.y, 0, moon.x, moon.y, Math.max(W, H) * 0.55);
    rg.addColorStop(0, 'rgba(64,84,132,0.28)'); rg.addColorStop(1, 'rgba(64,84,132,0)');
    ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H);
  }
  function drawNebula() {
    poffset(0.06);
    for (var i = 0; i < nebula.length; i++) {
      var n = nebula[i], dx = Math.sin(tGlobal * 0.0005 * n.sp + i) * 30;
      var rg = ctx.createRadialGradient(n.x + dx, n.y, 0, n.x + dx, n.y, n.rr);
      rg.addColorStop(0, n.hue + n.a + ')'); rg.addColorStop(1, n.hue + '0)');
      ctx.fillStyle = rg;
      ctx.fillRect(n.x + dx - n.rr, n.y - n.rr, n.rr * 2, n.rr * 2);
    }
    pend();
  }
  function drawStars(t) {
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i]; poffset(s.depth);
      var tw = reduce ? 1 : (0.55 + 0.45 * Math.sin(t * 0.001 * s.sp + s.tw));
      var a = s.base * tw;
      ctx.beginPath(); ctx.fillStyle = 'rgba(244,238,220,' + a.toFixed(3) + ')';
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
      if (s.r > 1.4) {
        ctx.beginPath(); ctx.fillStyle = 'rgba(244,238,220,' + (a * 0.16).toFixed(3) + ')';
        ctx.arc(s.x, s.y, s.r * 3, 0, Math.PI * 2); ctx.fill();
      }
      pend();
    }
  }
  function drawMoonGlow(t, alpha) {
    var pulse = reduce ? 1 : (0.9 + 0.1 * Math.sin(t * 0.0009));
    poffset(0.1);
    ctx.globalAlpha *= alpha;
    var rg = ctx.createRadialGradient(moon.x, moon.y, moon.r * 0.6, moon.x, moon.y, moon.r * 4.4);
    rg.addColorStop(0, 'rgba(244,214,150,' + (0.30 * pulse) + ')');
    rg.addColorStop(0.35, 'rgba(244,214,150,' + (0.12 * pulse) + ')');
    rg.addColorStop(1, 'rgba(244,214,150,0)');
    ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(moon.x, moon.y, moon.r * 4.4, 0, Math.PI * 2); ctx.fill();
    ctx.save(); ctx.translate(moon.x, moon.y); ctx.rotate(reduce ? 0 : t * 0.00003);
    for (var k = 0; k < 12; k++) {
      ctx.save(); ctx.rotate((Math.PI * 2 / 12) * k);
      var rg2 = ctx.createLinearGradient(0, moon.r * 0.8, 0, moon.r * 3.2);
      rg2.addColorStop(0, 'rgba(244,220,160,' + (0.06 * pulse) + ')');
      rg2.addColorStop(1, 'rgba(244,220,160,0)');
      ctx.fillStyle = rg2; ctx.beginPath();
      ctx.moveTo(0, moon.r * 0.8); ctx.lineTo(moon.r * 0.32, moon.r * 3.2); ctx.lineTo(-moon.r * 0.32, moon.r * 3.2);
      ctx.closePath(); ctx.fill(); ctx.restore();
    }
    ctx.restore(); pend();
  }
  function drawMoon(alpha) {
    poffset(0.1);
    ctx.globalAlpha *= alpha;
    var g = ctx.createRadialGradient(moon.x - moon.r * 0.15, moon.y - moon.r * 0.15, moon.r * 0.1, moon.x, moon.y, moon.r);
    g.addColorStop(0, '#f4f4f2'); g.addColorStop(0.5, '#e8e4dc');
    g.addColorStop(0.82, '#cfcabd'); g.addColorStop(1, '#a8a398');
    ctx.beginPath(); ctx.arc(moon.x, moon.y, moon.r, 0, Math.PI * 2); ctx.fillStyle = g; ctx.fill();
    ctx.save(); ctx.beginPath(); ctx.arc(moon.x, moon.y, moon.r, 0, Math.PI * 2); ctx.clip();
    var maria = [[-0.28, 0.0, 0.5, 0.28], [-0.2, -0.34, 0.34, 0.28], [0.16, -0.3, 0.3, 0.26], [0.26, 0.05, 0.26, 0.24], [0.5, -0.18, 0.2, 0.3], [-0.1, 0.34, 0.24, 0.2]];
    for (var i = 0; i < maria.length; i++) {

      var rr = ctx.createRadialGradient(cx, cy, 0, cx, cy, m[2] * moon.r);

      rr.addColorStop(0.6, 'rgba(96,100,116,' + (m[3] * 0.5) + ')');
      rr.addColorStop(1, 'rgba(96,100,116,0)');

    lg.addColorStop(0, 'rgba(0,0,0,0)'); lg.addColorStop(1, 'rgba(40,34,26,0.30)');

    ctx.restore(); pend();
  }
  function cloudLayer(depth, y, scale, speed, alpha, front) {
    poffset(depth);
    var span = W * 1.7, off = ((tGlobal * speed) % span);
    for (var c = 0; c < 3; c++) {
      var baseX = ((c * (span / 3) + off) % span) - W * 0.35;
      var yy = y + Math.sin(tGlobal * 0.0002 + c) * 8;
      var rg = ctx.createRadialGradient(baseX, yy, 0, baseX, yy, 240 * scale);
      var col = front ? 'rgba(206,214,236,' : 'rgba(150,164,200,';
      rg.addColorStop(0, col + alpha + ')');
      rg.addColorStop(0.5, col + (alpha * 0.5) + ')');
      rg.addColorStop(1, col + '0)');
      ctx.fillStyle = rg;
      ctx.beginPath(); ctx.ellipse(baseX, yy, 260 * scale, 62 * scale, 0, 0, Math.PI * 2); ctx.fill();
    }
    pend();
  }
  function drawHills(alpha) {
    poffset(0.18); ctx.globalAlpha *= alpha;
    ctx.beginPath(); ctx.moveTo(-W * 0.1, waterY);
    for (var x = -W * 0.1; x <= W * 1.1; x += 12) {
      var y = waterY - H * 0.05 - Math.sin(x * 0.008 + 1) * H * 0.02 - Math.sin(x * 0.02) * H * 0.008;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(W * 1.1, waterY); ctx.closePath(); ctx.fillStyle = '#0a1120'; ctx.fill(); pend();
    poffset(0.3);
    ctx.beginPath(); ctx.moveTo(-W * 0.1, waterY);
    for (var x2 = -W * 0.1; x2 <= W * 1.1; x2 += 12) {
      var y2 = waterY - H * 0.02 - Math.sin(x2 * 0.013 + 3) * H * 0.018;
      ctx.lineTo(x2, y2);
    }
    ctx.lineTo(W * 1.1, waterY); ctx.closePath(); ctx.fillStyle = '#060b16'; ctx.fill(); pend();
  }
  function drawWater(t) {
    poffset(0.06);
    var g = ctx.createLinearGradient(0, waterY, 0, H);
    g.addColorStop(0, 'rgba(10,20,38,0.6)'); g.addColorStop(1, 'rgba(4,7,14,0.95)');
    ctx.fillStyle = g; ctx.fillRect(-W, waterY, W * 3, H - waterY + 2);
    var colW = moon.r * 1.5;
    for (var i = 0; i < 46; i++) {
      var yy = waterY + (i / 46) * (H - waterY), f = i / 46;
      var amp = (10 + f * 46), dx = Math.sin(t * 0.0011 + i * 0.55) * amp;
      var segW = colW * (1 - f * 0.35) * (0.5 + 0.5 * Math.sin(t * 0.0016 + i * 0.8));
      var a = (1 - f) * 0.30 + 0.04;
      var rg = ctx.createLinearGradient(moon.x + dx - segW, yy, moon.x + dx + segW, yy);
      rg.addColorStop(0, 'rgba(244,214,150,0)');
      rg.addColorStop(0.5, 'rgba(244,214,150,' + a.toFixed(3) + ')');
      rg.addColorStop(1, 'rgba(244,214,150,0)');
      ctx.fillStyle = rg; ctx.fillRect(moon.x + dx - segW, yy - 2.2, segW * 2, 4.4);
    }
    var rd = ctx.createRadialGradient(moon.x, waterY + 6, 0, moon.x, waterY + 6, moon.r * 1.1);
    rd.addColorStop(0, 'rgba(244,222,170,0.20)'); rd.addColorStop(1, 'rgba(244,222,170,0)');
    ctx.fillStyle = rd; ctx.beginPath(); ctx.arc(moon.x, waterY + 6, moon.r * 1.1, 0, Math.PI * 2); ctx.fill();
    var speeds = [0.020, -0.014, 0.030, -0.022, 0.045];
    for (var w = 0; w < speeds.length; w++) {
      var yBase = waterY + (H - waterY) * (0.12 + w * 0.14), alpha = 0.05 + (w % 2 ? 0.03 : 0);
      ctx.beginPath();
      for (var x = -20; x <= W + 20; x += 8) {
        var yy2 = yBase + Math.sin(x * 0.03 + t * 0.001 * speeds[w] * 30 + w) * (2 + w * 0.6);
        if (x === -20) ctx.moveTo(x, yy2); else ctx.lineTo(x, yy2);
      }
      ctx.strokeStyle = 'rgba(196,210,232,' + alpha + ')'; ctx.lineWidth = 1; ctx.stroke();
    }
    pend();
  }
  function drawFireflies(t) {
    for (var i = 0; i < fireflies.length; i++) {
      var f = fireflies[i];
      f.gx += 0.0016 * f.sp; f.gy += 0.0013 * f.sp;
      var fx = f.x + Math.sin(f.gx) * f.amp, fy = f.y + Math.cos(f.gy) * f.amp * 0.6;
      var fl = reduce ? 0.8 : (0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t * 0.001 * f.flsp + f.fl)));

      ctx.arc(fx, fy, f.r * 3.2, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.fillStyle = 'rgba(255,240,205,' + (0.8 * fl) + ')';
      ctx.arc(fx, fy, f.r, 0, Math.PI * 2); ctx.fill();

    }
  }
  function drawPetals(dt) {
    for (var i = 0; i < petals.length; i++) {
      var p = petals[i];
      p.y += p.vy; p.sw += dt * p.sway * 2; p.rot += p.vr * dt;
      if (p.y > H + 12) { petals[i] = newPetal(false); continue; }

      poffset(p.depth); ctx.save(); ctx.translate(px, p.y); ctx.rotate(p.rot);

  }

  /* ================= 动态元素 ================= */
  function drawTrail(trail, col, width) {
    for (var k = 0; k < trail.length; k++) {
      var a = (k + 1) / trail.length * 0.5;

      ctx.beginPath();

      if (k + 1 < trail.length) ctx.lineTo(trail[k + 1].x, trail[k + 1].y);
      else ctx.lineTo(trail[k].x, trail[k].y);
      ctx.stroke();
    }
  }

  function drawShots(dt) {
    poffset(0.15);
    for (var i = shoots.length - 1; i >= 0; i--) {
      var s = shoots[i]; s.life += dt; s.x += s.vx; s.y += s.vy;
      var a = Math.max(0, 1 - s.life / s.ttl);
      var grad = ctx.createLinearGradient(s.x, s.y, s.x - s.vx * 6, s.y - s.vy * 6);
      grad.addColorStop(0, 'rgba(255,250,235,' + (0.9 * a) + ')');

      ctx.strokeStyle = grad; ctx.lineWidth = 1.6; ctx.lineCap = 'round';

    }
    pend();
  }

  function drawRockets(dt) {
    ctx.lineCap = 'round';

      var r = rockets[i];
      r.t += dt;
      var p = Math.min(1, r.t / r.dur);
      var ease = 1 - Math.pow(1 - p, 3);
      var nx = r.sx + (r.tx - r.sx) * ease;
      var ny = r.sy + (r.ty - r.sy) * ease;
      r.trail.unshift({ x: nx, y: ny });

      for (var k = 0; k < r.trail.length; k++) {
        var a = (1 - k / r.trail.length) * 0.7;
        ctx.strokeStyle = 'rgba(' + col + ',' + a.toFixed(3) + ')';
        ctx.lineWidth = 2.2 * (1 - k / r.trail.length);
        ctx.beginPath();
        ctx.moveTo(r.trail[k].x, r.trail[k].y);
        ctx.lineTo(r.trail[Math.min(k + 1, r.trail.length - 1)].x, r.trail[Math.min(k + 1, r.trail.length - 1)].y);
        ctx.stroke();

      ctx.beginPath(); ctx.fillStyle = 'rgba(255,250,230,0.95)';
      ctx.arc(nx, ny, 2, 0, Math.PI * 2); ctx.fill();

      }
    }
  }

  function drawSparks(dt) {
    ctx.lineCap = 'round';
    for (var i = sparks.length - 1; i >= 0; i--) {
      var s = sparks[i];
      s.life += dt;
      if (s.flash) {
        var fa = Math.max(0, 1 - s.life / s.ttl);
        ctx.beginPath();
        ctx.fillStyle = 'rgba(' + s.col + ',' + (fa * 0.85).toFixed(3) + ')';

  function drawTexts(dt) {

          ctx.lineWidth = 2.4 * (1 - k / T.trail.length);
          ctx.beginPath();
          ctx.moveTo(T.trail[k].x, T.trail[k].y);
          ctx.lineTo(T.trail[Math.min(k + 1, T.trail.length - 1)].x, T.trail[Math.min(k + 1, T.trail.length - 1)].y);

          q.seek += dt;
          if (q.seek < 0.9) {                       // 爆散 → 汇聚
            q.vx *= 0.96; q.vy *= 0.96;
            q.x += q.vx + (q.tx - q.x) * 0.085;
            q.y += q.vy + (q.ty - q.y) * 0.085;
          } else {                                   // 定格闪烁
            q.x += (q.tx - q.x) * 0.14;
            q.y += (q.ty - q.y) * 0.14;
            q.hold += dt;
            if (q.hold > 1.7) { q.vy = (q.vy || 0) + 26 * dt; q.y += q.vy; q.x += Math.sin(q.seed + q.hold * 3) * 0.4; }
            if (q.hold > 2.9) { q.dead = true; continue; }
          }
          var fl = 0.6 + 0.4 * Math.sin((T.t + q.seed) * 7);
          var fade = q.hold > 1.7 ? Math.max(0, 1 - (q.hold - 1.7) / 1.2) : 1;
          if (fade <= 0) { q.dead = true; continue; }
          alive++;
          ctx.beginPath();
          ctx.fillStyle = 'rgba(' + q.col + ',' + (0.10 * fl * fade).toFixed(3) + ')';
          ctx.arc(q.x, q.y, q.sz * 2.4, 0, Math.PI * 2); ctx.fill();
          ctx.beginPath();
          ctx.fillStyle = 'rgba(' + q.col + ',' + (0.85 * fl * fade).toFixed(3) + ')';
          ctx.arc(q.x, q.y, q.sz, 0, Math.PI * 2); ctx.fill();
        }
        if (T.t > 1.2 && T.glowCol && T.total) {   // 烟花映水：文字成形时水面泛起同色微光
          var ga = 0.075 * Math.min(1, (T.t - 1.2) / 0.9) * (alive / T.total);
          if (ga > 0.004) {
            poffset(0.06);
            var gg = ctx.createRadialGradient(T.ax, waterY + 16, 0, T.ax, waterY + 16, W * 0.17);
            gg.addColorStop(0, 'rgba(' + T.glowCol + ',' + ga.toFixed(3) + ')');
            gg.addColorStop(1, 'rgba(' + T.glowCol + ',0)');
            ctx.fillStyle = gg;
            ctx.beginPath(); ctx.arc(T.ax, waterY + 16, W * 0.17, 0, Math.PI * 2); ctx.fill();
            pend();
          }
        }
        if (allDone || (alive === 0 && T.t > 3)) texts.splice(ti, 1);
      }
    }
  }

  function drawLanterns(dt) {
    for (var i = lanterns.length - 1; i >= 0; i--) {
      var L = lanterns[i];
      L.life += dt; L.y -= L.vy * dt; L.sway += dt * L.sw; L.fl += dt * 2.4;
      var lx = L.x + Math.sin(L.sway) * 10 * L.depth;
      var flick = 0.7 + 0.3 * Math.sin(L.fl), app = Math.min(1, L.life / 1.2);
      poffset(L.depth);
      var rg = ctx.createRadialGradient(lx, L.y, 0, lx, L.y, L.w * 3.4);
      rg.addColorStop(0, 'rgba(255,180,96,' + (0.5 * flick * app) + ')');
      rg.addColorStop(1, 'rgba(255,180,96,0)');
      ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(lx, L.y, L.w * 3.4, 0, Math.PI * 2); ctx.fill();
      var bg = ctx.createLinearGradient(lx - L.w / 2, L.y, lx + L.w / 2, L.y);
      bg.addColorStop(0, 'rgba(255,150,70,' + (0.85 * app) + ')');
      bg.addColorStop(0.5, 'rgba(255,214,120,' + (0.95 * app * flick) + ')');
      bg.addColorStop(1, 'rgba(255,150,70,' + (0.85 * app) + ')');
      ctx.fillStyle = bg; roundRect(lx - L.w / 2, L.y - L.h / 2, L.w, L.h, 3.5); ctx.fill();
      ctx.fillStyle = 'rgba(255,240,200,' + (0.9 * app * flick) + ')';
      ctx.fillRect(lx - 1, L.y + L.h / 2 - 1.5, 2, 3);
      pend();
      if (L.y < waterY + 30) {
        poffset(0.06);
        var ry = waterY + (waterY - L.y) * 0.25 + 14;
        var fa = 0.12 * app * flick * Math.max(0, 1 - (ry - waterY) / (H - waterY));
        var rr = ctx.createRadialGradient(lx, ry, 0, lx, ry, L.w * 2.4);
        rr.addColorStop(0, 'rgba(255,180,96,' + fa.toFixed(3) + ')');
        rr.addColorStop(1, 'rgba(255,180,96,0)');
        ctx.fillStyle = rr; ctx.beginPath(); ctx.arc(lx, ry, L.w * 2.4, 0, Math.PI * 2); ctx.fill();
        pend();
      }
      if (L.y < -40) lanterns.splice(i, 1);
    }
  }

  /* ================= 主循环 ================= */
  var start = performance.now(), last = start;
  var nextAmbient = 6.0, nextText = 13.5, nextLantern = 12, nextShoot = 4.0;
  var wishIdx = 0;

  function resetTimeline() {
    start = performance.now(); last = start;
    nextAmbient = 6.0; nextText = 13.5; nextLantern = 12; nextShoot = 4.0;
    rockets.length = 0; sparks.length = 0; texts.length = 0; lanterns.length = 0; shoots.length = 0;
    var hint = document.getElementById('hint');
    hint.style.animation = '';
    hint.style.opacity = '';
  }

  function frame(now) {
    var t = (now - start) / 1000;
    tGlobal = now;
    var dt = Math.min(0.05, (now - last) / 1000); last = now;

    if (!pointerActive || now - lastMove > 2600) {
      par.tx = Math.sin(now * 0.00013) * 0.6;
      par.ty = Math.cos(now * 0.00010) * 0.4;
    }
    par.x += (par.tx - par.x) * 0.04;
    par.y += (par.ty - par.y) * 0.04;

    var stage = function (t0, dur) { return Math.max(0, Math.min(1, (t - t0) / (dur || 1))); };

    ctx.clearRect(0, 0, W, H);
    drawSky();
    ctx.globalAlpha = stage(0, 1.2); drawNebula();
    ctx.globalAlpha = stage(0.2, 1.4); drawStars(t);

    var mA = stage(0.8, 1.8);
    if (mA > 0) {
      ctx.save();
      ctx.globalAlpha = 1;
      drawMoonGlow(t, mA); drawMoon(mA);
      ctx.restore();
    }
    ctx.globalAlpha = 1;

    ctx.globalAlpha = stage(1.5, 1.6) * 0.8; cloudLayer(0.2, moon.y + moon.r * 0.3, 1.0, 0.012, '0.10', false);
    ctx.globalAlpha = stage(1.8, 1.6) * 0.9; cloudLayer(0.4, moon.y - moon.r * 0.6, 0.7, -0.02, '0.13', true);
    ctx.globalAlpha = stage(1.6, 1.6); drawHills(1);
    ctx.globalAlpha = stage(2.0, 1.6); drawWater(t);
    ctx.globalAlpha = 1;

    if (t > 3.0 && !reduce) drawFireflies(t);
    if (t > 2.6) drawPetals(dt);

    /* --- 调度 --- */
    if (t > nextShoot) { spawnShoot(); nextShoot = t + rnd(6, 11); }
    if (t > nextAmbient) {                       // 普通烟花只在两翼升空，避开中央文字区
      var fx, fy;
      if (texts.length > 0) {                    // 文字正在成形时，退到更远的外侧、更高处
        fx = Math.random() < 0.5 ? rnd(0.06, 0.18) : rnd(0.82, 0.94);
        fy = rnd(0.10, 0.24);
      } else {
        fx = Math.random() < 0.5 ? rnd(0.08, 0.32) : rnd(0.68, 0.92);
        fy = rnd(0.12, 0.36);
      }
      spawnRocket(W * fx, H * fy, rnd(0.7, 1.0));
      nextAmbient = t + rnd(2.8, 5.5);
    }
    if (t > nextText) {
      if (!texts.some(function (x) { return x.phase === 'rise'; }) && texts.length < 2) {
        spawnTextFirework(CONFIG.wishes[wishIdx % CONFIG.wishes.length]);
        wishIdx++;
        nextText = t + rnd(7, 9.5);
      } else nextText = t + 1;
    }
    if (t > nextLantern) { spawnLantern(); nextLantern = t + rnd(9, 14); }

    if (t > 3.4) drawShots(dt);
    if (t > 5.5) drawRockets(dt);
    if (t > 5.5) drawSparks(dt);
    if (t > 7.5) { drawTexts(dt); } else { texts.length = 0; }
    ctx.globalAlpha = stage(3.0, 1.4); drawLanterns(dt); ctx.globalAlpha = 1;

    ctx.globalAlpha = 1;
    if (!reduce) requestAnimationFrame(frame);
  }

  /* ---------- 交互 ---------- */
  var hintEl = document.getElementById('hint');
  cv.addEventListener('pointerdown', function (e) {
    unlockAudio();
    if (reduce) return;
    var x = e.clientX, y = e.clientY;
    if (y > waterY - 24) { spawnLantern(x); }
    else { spawnRocket(x, y, 1.15); }
    hintEl.style.animation = 'none';
    hintEl.style.opacity = '0';
  });
  document.getElementById('btnLantern').addEventListener('click', function (e) {
    e.stopPropagation();
    unlockAudio();
    spawnLantern(W * rnd(0.3, 0.7));
    setTimeout(function () { spawnLantern(W * rnd(0.2, 0.8)); }, 420);
    setTimeout(function () { spawnLantern(W * rnd(0.2, 0.8)); }, 840);
  });
  document.getElementById('btnReplay').addEventListener('click', function (e) {
    e.stopPropagation();
    unlockAudio();
    resetTimeline();
    document.body.classList.remove('go');
    void document.body.offsetWidth;
    document.body.classList.add('go');
  });
  document.getElementById('btnClean').addEventListener('click', function (e) {
    e.stopPropagation();
    document.body.classList.toggle('clean');
  });
  document.getElementById('btnSound').addEventListener('click', function (e) {
    e.stopPropagation();
    unlockAudio();
    setMute(!muted);
  });
  window.addEventListener('keydown', function (e) {
    unlockAudio();
    if (e.key === 'h' || e.key === 'H') document.body.classList.toggle('clean');
    if (e.key === 'm' || e.key === 'M') setMute(!muted);
    if (e.key === 'r' || e.key === 'R') document.getElementById('btnReplay').click();
    if (e.key === 'l' || e.key === 'L') document.getElementById('btnLantern').click();
    if (e.key === ' ') {
      e.preventDefault();
      spawnRocket(W * (Math.random() < 0.5 ? rnd(0.1, 0.34) : rnd(0.66, 0.9)), H * rnd(0.14, 0.36), 1.15);
    }
  });

  /* ---------- 静态兜底（减弱动态效果时） ---------- */
  function renderStatic() {
    var t = 3000;
    tGlobal = performance.now();
    ctx.clearRect(0, 0, W, H);
    drawSky(); drawNebula(); drawStars(t);
    drawMoonGlow(t, 1); drawMoon(1);
    cloudLayer(0.2, moon.y + moon.r * 0.3, 1.0, 0.012, '0.10', false);
    cloudLayer(0.4, moon.y - moon.r * 0.6, 0.7, -0.02, '0.13', true);
    drawHills(1); drawWater(t);
    var lx = [0.24, 0.5, 0.72, 0.4, 0.82], ly = [0.5, 0.36, 0.44, 0.3, 0.4];
    lanterns.length = 0;
    for (var i = 0; i < 5; i++) {
      spawnLantern(lx[i] * W);
      var L = lanterns[lanterns.length - 1];
      L.y = ly[i] * H; L.life = 5;
    }
    drawLanterns(0.016); drawFireflies(t); drawPetals(0.016);
  }

  window.addEventListener('resize', function () { resize(); if (reduce) renderStatic(); });

  /* ---------- 启动 ---------- */
  resize();
  document.body.classList.add('go');
  (function () { var ic = document.getElementById('sfxIcon'); if (ic) ic.textContent = muted ? '🔇' : '🔊'; })();
  if (reduce) renderStatic(); else requestAnimationFrame(frame);

  /* 调试钩子（不影响页面，可用 ?debug 关闭提示） */
  window.__zq = function () {
    return {
      t: ((performance.now() - start) / 1000).toFixed(2),
      rockets: rockets.length, sparks: sparks.length,
      lanterns: lanterns.length, texts: texts.length,
      textInfo: texts.map(function (T) {
        return { text: T.text, phase: T.phase, t: +T.t.toFixed(2), parts: T.parts.length };
      }),
      wishIdx: wishIdx, nextText: +nextText.toFixed(2), nextAmbient: +nextAmbient.toFixed(2),
      sfx: Object.keys(sfx).map(function (k) { return k + ':' + sfx[k].length; }).join(','),
      bgm: bgmEl ? (bgmEl.paused ? 'paused' : 'playing') : 'none',
      muted: muted
    };
  };
})();
</script>
</body>
</html>
